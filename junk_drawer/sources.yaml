    before trusting it blindly if time has passed.

    '
  replacement_candidates:
  - Tank01 (RapidAPI) -- has an injury list endpoint per the v1 client code; not tested live
  - Official team beat-writer RSS feeds (not investigated)
  last_verified: '2026-09-25'
