- id: nflverse_depth_charts
  status: active
  league: nfl
  kind: csv_release
  base_url: https://github.com/nflverse/nflverse-data/releases/tag/depth_charts
  auth: none
  ingest_script: scripts/ingest_nfl_player_usage.py
  feeds_tables:
  - silver.nfl_depth_chart_snapshot
  cadence: 'multiple times per week -- this is a point-in-time snapshot series, so cadence IS
    the data. Missing a week does not leave a gap in a weekly table, it leaves you without a
    pre-kickoff snapshot for that week''s games, which silently drops those games from
    v_nfl_depth_chart_pregame. Re-pull before each slate.'
  risk: 'CONFIRMED live 2026-09-25 with real 2026 data: 559,864 rows, 197 distinct snapshot
    timestamps spanning 2026-03-22 to 2026-09-25, all 32 teams. Team codes match our schedule
    exactly (uses ''LA'' for the Rams -- NOT the ''LAR'' mismatch that affects rotowire_props).
    gsis_id populated on ~95% of offensive rows and joins cleanly to silver.nfl_player: 304 of
    306 qualified players matched a depth rank. Underlying data is ESPN-sourced, so the usual
    ESPN caveat applies one layer down -- and WR depth is listed up to 16 deep, where the tail
    ranks (WR5+) are noisy and should not be read as a real hierarchy. dt is ISO-8601 with a
    literal Z and MUST be cast to TIMESTAMPTZ; storing it naive reproduces the exact bug
    already fixed on gold.nfl_prop_line_rotowire. File is 53MB uncompressed -- the largest
    single pull in this ramp.'
  replacement_candidates:
  - Tank01 (RapidAPI) -- has depth charts per its docs; not built, needs a live key test
  - ESPN depth chart endpoints directly (would remove the nflverse mirror layer but add the
    unofficial-API risk already flagged for espn_news)
  last_verified: '2026-09-25'
