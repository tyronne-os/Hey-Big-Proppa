# =============================================================================
# The Utility Room -- one file describing every data source feeding the lake.
# =============================================================================
# Purpose: each source can be inspected, disabled, rate-limited, or swapped
# for a replacement without touching any other source or any ingest script's
# internals. This file is the single place to look before deciding "is this
# source healthy" or "what do I change to fix/replace it."
#
# Fields:
#   id            -- stable short name, matches what scripts/sources.py prints
#   status        -- active | disabled | deprecated | broken
#   league        -- which ramp this belongs to (nfl for now)
#   kind          -- api | web_embed | csv_release
#   base_url      -- root endpoint/page, for a quick manual health check
#   auth          -- none | cookie_file | api_key ; if api_key, the ENV VAR NAME
#                    only -- never a value, per project security rules
#   ingest_script -- which script pulls this source
#   feeds_tables  -- which silver/gold tables this source populates
#   cadence       -- how often it should realistically be re-pulled
#   risk          -- confirmed risk notes (ToS, stability, access-control caveats)
#   replacement_candidates -- alternates already vetted or worth checking if
#                    this source breaks/changes/disappears
#   last_verified -- date this source was last confirmed live with real data

sources:
- id: nflverse_stats
  status: active
  league: nfl
  kind: csv_release
  base_url: https://github.com/nflverse/nflverse-data/releases
  auth: none
  ingest_script: scripts/ingest_nfl_2026.py
  feeds_tables:
  - silver.nfl_player_passing_week
  - silver.nfl_player_rushing_week
  - silver.nfl_player_receiving_week
  - silver.nfl_player_scrimmage_week
  - silver.nfl_player_defense_week
  - silver.nfl_player_scoring_week
  - silver.nfl_player_kicking_week
  - silver.nfl_player_returns_week
  - silver.nfl_pfr_adv_passing_week
  - silver.nfl_pfr_adv_rushing_week
  - silver.nfl_pfr_adv_receiving_week
  - silver.nfl_pfr_adv_defense_week
  - silver.nfl_team_week
  - silver.nfl_player
  - silver.nfl_game
  cadence: nightly during season (nflverse's own update schedule)
  risk: 'Open-data community project (GitHub Actions automation, not a paid SLA). Reliable
    historically but no support contract. Also mirrors PFR''s own advanced stats directly
    -- this is why PFR itself is never scraped.

    '
  replacement_candidates:
  - ESPN team/player season stats (site.web.api.espn.com) -- thinner columns, would need rebuilding
    the schema mapping
  last_verified: '2026-09-24'
