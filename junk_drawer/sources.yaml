- id: rotowire_props
  status: active
  league: nfl
  kind: web_embed
  base_url: https://www.rotowire.com/betting/nfl/player-props.php
  auth: none
  ingest_script: scripts/ingest_rotowire_props.py
  feeds_tables:
  - gold.nfl_prop_line_rotowire
  - gold.nfl_prop_market_catalog
  - gold.nfl_prop_book_catalog
  cadence: ONGOING, multiple times per week (promoted 2026-09-25 per user decision -- this
    is our own free line-movement source; a hook reminds the agent to re-snapshot regularly).
    No hard request cap.
  risk: "robots.txt confirmed to allow /betting/. Data is RotoWire's own first-party embedded\
    \ JSON (not the \"Props.Cash\" third-party demo widget also present on the page, which\
    \ is explicitly NOT used). isPaywalled flag only gates their CSV *export* button, not\
    \ the underlying data. Scoped to draftkings/fanduel/caesars per user request -- the source\
    \ itself carries more books (betr, betrivers, fanatics, mgm, hardrock, thescore, circasports)\
    \ if that scope needs widening later. bet365 was requested but does not appear on this\
    \ source at all.\n Two real bugs found and fixed 2026-09-25: fetched_at_utc was stored\
    \ as naive local time under a column named _utc (fixed to TIMESTAMPTZ); movement view\
    \ was mixing pre-game and live in-game snapshots (fixed with an is_pregame flag computed\
    \ against our own schedule table -- only pregame snapshots feed v_nfl_prop_line_movement)."
  replacement_candidates:
  - Tank01 (RapidAPI) -- documented, not built; needs the user's own live test call against
    their key
  - The Odds API (THE_ODDS_API_KEY already available) -- game lines confirmed available; player
    props coverage not yet checked
  last_verified: '2026-09-25'
