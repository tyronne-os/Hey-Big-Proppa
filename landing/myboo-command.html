<style>
:root{--bg:#0b0512;--bg2:#140a20;--card:#1b1226;--card2:#241e2c;--line:#2a1e36;--fg:#ece6f2;--mut:#8a8290;--gold:#d9b45a;--gold2:#f7e7a6;--deep:#8a6224;--mint:#2ee6a6;--red:#ff5d73;--vio:#a779e8;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 50% -100px,#2a1240,var(--bg));background-color:var(--bg);color:var(--fg);font:15px/1.6 Inter,system-ui,sans-serif;padding-inline:16px;padding-block:24px}
main{max-width:1040px;margin:auto;display:flex;flex-direction:column;gap:26px}
.gold{background:linear-gradient(90deg,var(--gold2),var(--gold),var(--deep));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font:900 clamp(30px,6vw,50px)/1 Fraunces,Georgia,serif;margin:0}h2{font:800 12px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.mono{font-family:'JetBrains Mono',monospace}.mut{color:var(--mut)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1.5px solid var(--deep);border-radius:20px;padding:20px;min-width:0}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.ring{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ring small{font:500 10px 'JetBrains Mono';letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.hero{border-color:var(--red);background:linear-gradient(135deg,#2a0f1c,var(--bg2) 60%)}
.herogrid{display:grid;grid-template-columns:minmax(210px,260px) 1fr;gap:22px;align-items:center}@media(max-width:640px){.herogrid{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:minmax(130px,230px) 1fr 50px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.track{height:12px;background:var(--card2);border-radius:6px;overflow:hidden;display:flex}.track i{display:block;height:100%}
#kg{width:100%;height:auto;background:#09040f;border-radius:14px;border:1px solid var(--line)}
#kg text{font:600 11px Inter,sans-serif;fill:var(--fg);pointer-events:none}#kg .e{stroke:var(--mut);stroke-opacity:.35;fill:none}#kg .dim{opacity:.12}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);margin-top:10px}.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.recap p{margin:0 0 14px}.win{display:grid;gap:14px}
.lesson{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:14px}
.lesson>b{font:900 30px Fraunces,serif;color:var(--gold)}.lesson h3{margin:0 0 4px;font:800 16px Inter}.lesson p{margin:0;color:#cfc6da;font-size:14px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}th{font:500 10px 'JetBrains Mono';letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.tag{font:800 10px 'JetBrains Mono';padding:2px 8px;border-radius:99px;background:var(--mint);color:#04120c}
</style>

<section class="zed"><div class="zk">☣ Outbreak report · Bills @ Rams · Monday night</div>
<h2 class="zt" style="color:#f4eee8;font-size:clamp(40px,10vw,92px);letter-spacing:-.02em;margin:8px 0 4px;text-transform:uppercase">${hero.tickets} tickets later…<em>the infection spreads</em></h2>
<div class="mut" style="max-width:640px">Day 0: 42 healthy tickets. By the fourth quarter, 23 were dead and 13 of them were one leg from walking out alive. Here's how the virus moved.</div>
<div class="pz"><div class="pzbox"><img class="pzph" src="${PH['Keon Coleman']}" alt="Keon Coleman"><div style="font:900 22px Fraunces;margin-top:10px">Keon Coleman</div><div class="mut" style="font-size:12px">over 2.5 receptions · caught <b style="color:#ff5d73">${hero.actual}</b></div><span class="stamp">PATIENT ZERO</span><div style="margin-top:10px;font:800 40px 'JetBrains Mono';color:#ff2d4a">${hero.tickets}</div><div class="zk" style="font-size:9px">tickets infected</div></div>
<div class="zc"><p>Every outbreak starts with one idiot who thought a bite was a hickey. Ours was Keon Coleman, <b>WR3</b> on the Bills depth chart, averaging four targets a game, who we somehow decided was structural steel for <b>nine tickets</b>. He caught ONE ball. One! Patient Zero was the only dead leg on <b>five</b> tickets that were otherwise perfectly healthy. That's the 28 Days Later opening scene where the monkey gets out of the lab, except the lab is us, and we're the monkey. 😡</p>
<p>Then it jumped hosts. Davante Adams came down with it twice, 62.5 and 59.5 receiving yards, <b>${adamsAll} ticket slots</b>, and he finished on 51. DJ Moore got a goose egg on four tickets (zero yards, nobody home). Dalton Kincaid and Ray Davis ran to the finish line and coughed on the way in.</p>
<p>Notice what the infected have in common: <b>we stacked the same few props on card after card</b>. One bad afternoon from one guy and the whole herd turns on itself. Day 28, the survivors are the 3-leg tickets, they went 17 for 22, while the 4-plus-leg ones went 2 for 20. The worst part is the game did everything right. Seventy-one points, the over crushed by 16.5, and we STILL managed to bleed out. That's not bad luck, that's an immune system we forgot to build. Quarantine rules for Thursday: one player, one prop, three legs, and nobody who isn't a target in the first place. 🧟</p></div></div>

add(`<section class="card recap"><h2>🔥 The brutally honest recap</h2>
<p>Let's get the good news out of the way, because it's short: we went 17 for 31 on individual predictions, 19 tickets cashed, and the card still printed a profit of $529.86 on $210 staked. Congratulations, we're gamblers who accidentally behaved like a hedge fund for ten minutes. Now let's talk about the part where we behaved like absolute dumbasses. 😡</p>
<p>Thirteen. THIRTEEN tickets died by exactly ONE leg. That's not bad luck, that's a design flaw you could see from space. And the biggest flaw wore number 0 for Buffalo: Keon Coleman, a WR3 on the depth chart averaging four targets a game, got slapped onto nine tickets with an over 2.5 receptions line. He caught ONE ball. One. He was the only miss on five tickets that otherwise cashed. Whoever decided a third-string-in-the-pecking-order receiver deserved to be the load-bearing wall of nine parlays needs to take a long, hard look at their life choices. 🤡</p>
<p>And who in the fuck selected Davante Adams to be on every ticket? Two different lines, 62.5 and 59.5 yards, stacked across seven ticket slots, and the man finished with 51. Fifty-one! Whoever did that needs a piss test, because they were obviously smoking crack! 😤 The man IS a target hog (24% of the Rams' looks, 9.5 a game), so the pick wasn't stupid. The DUPLICATION was. You don't put the same guy's yardage on every ticket and then act surprised when one dead afternoon wipes the whole fucking card.</p>
<p>Then there's the length problem. Tickets with three legs or fewer went 17-5. Tickets with four or more went 2-18. Two and eighteen. We built a ten-leg ticket, and I'm not even mad, I'm just impressed by the confidence of a ticket that had a roughly 0% chance of existing. 💀 The data told us this the entire time: bigger payouts, smaller brains.</p>
<p>The game itself was a gift. Bills 37, Rams 34, total of 71 against a line of 54.5, the over smashed by 16.5, the underdog won outright. Offense everywhere, and we STILL managed to lose 23 tickets. That's like getting handed the answers and failing the test on spelling your name. The fix isn't magic. One player, one prop. Targets over vibes. Three legs and go home. Thursday is a clean single game, Seahawks at Broncos, and the knowledge graph above is how we make sure Monday's stupidity dies with Monday. 🚫🤦</p></section>`);
